name: test

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  # Every game played under ASan/UBSan, and the binaries, on both hosts.
  # filo-term and Filo are sibling checkouts, as on a developer's disk.
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    env:
      CC: clang
    steps:
      - uses: actions/checkout@v4
        with:
          path: filo-games
      - uses: actions/checkout@v4
        with:
          repository: crgimenes/filo-term
          path: filo-term
      - uses: actions/checkout@v4
        with:
          repository: crgimenes/clang_filo
          path: clang_filo
      - run: make -C filo-games all test

  # The games compiled by Go's filo and by C's must be the same bytes:
  # it cannot matter which one a user has.
  filo-go-c:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CC: clang
    steps:
      - uses: actions/checkout@v4
        with:
          path: filo-games
      - uses: actions/checkout@v4
        with:
          repository: crgimenes/filo-term
          path: filo-term
      - uses: actions/checkout@v4
        with:
          repository: crgimenes/clang_filo
          path: clang_filo
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go install github.com/crgimenes/filo/cmd/filo@latest
      - run: |
          make -C filo-games donut.fbb snake.fbb down.fbb fire.fbb
          mkdir c && mv filo-games/*.fbb c/
          rm -f filo-games/build/*.fbc
          make -C filo-games donut.fbb snake.fbb down.fbb fire.fbb FILO_CLI="$(go env GOPATH)/bin/filo"
          for g in donut snake down fire; do cmp filo-games/$g.fbb c/$g.fbb; done

  # The release's Linux binaries: musl, static, nothing to install.
  static:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    container: alpine:3.22
    steps:
      - run: apk add clang make musl-dev file go git
      - uses: actions/checkout@v4
        with:
          path: filo-games
      - uses: actions/checkout@v4
        with:
          repository: crgimenes/filo-term
          path: filo-term
      - uses: actions/checkout@v4
        with:
          repository: crgimenes/clang_filo
          path: clang_filo
      - run: go install github.com/crgimenes/filo/cmd/filo@latest
      - run: make -C filo-games all CC=clang LDFLAGS=-static FILO_CLI="$(go env GOPATH)/bin/filo"
      - run: for g in filo-games/bin/*; do file $g | grep -q 'statically linked'; done

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: filo-games
      - uses: actions/checkout@v4
        with:
          repository: crgimenes/filo-term
          path: filo-term
      - uses: actions/checkout@v4
        with:
          repository: crgimenes/clang_filo
          path: clang_filo
      - name: Install tools
        run: |
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          sudo bash llvm.sh 23
          sudo apt-get install -y clang-format-23 clang-tidy-23 cppcheck
      - run: make -C filo-games fmt-check tidy check CLANG_FORMAT=clang-format-23 CLANG_TIDY=clang-tidy-23
